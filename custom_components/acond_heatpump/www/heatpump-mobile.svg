<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f4f7"/><stop offset="1" stop-color="#cfd7de"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd7de"/><stop offset=".5" stop-color="#f4f6f8"/><stop offset="1" stop-color="#c6ced6"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5533d" stop-opacity=".35"/><stop offset="1" stop-color="#3d8be5" stop-opacity=".25"/>
    </linearGradient>
  </defs>

  <!-- ===== potrubí ===== -->
  <g fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M290 230 H330" stroke="#e5533d"/>
    <path d="M318 230 V520 H362" stroke="#e5533d"/>
    <path d="M362 800 H305 V330 H290" stroke="#3d8be5"/>
  </g>
  <!-- přemostění zpátečky z domu přes výstupní vodu -->
  <path d="M330 330 H333 A15 15 0 0 0 303 330" fill="none" stroke="#3d8be5" stroke-width="10" stroke-linecap="round"/>

  <!-- ===== venkovní jednotka ===== -->
  <rect x="52" y="383" width="22" height="22" rx="4" fill="#7c8792"/>
  <rect x="246" y="383" width="22" height="22" rx="4" fill="#7c8792"/>
  <rect x="30" y="155" width="260" height="230" rx="18" fill="url(#unit)" stroke="#8d99a5" stroke-width="3"/>
  <circle cx="130" cy="270" r="82" fill="#9aa6b2"/>
  <circle cx="130" cy="270" r="76" fill="#2f3a45"/>
  <g stroke="#56636f" stroke-width="2" fill="none">
    <circle cx="130" cy="270" r="59"/><circle cx="130" cy="270" r="41"/><circle cx="130" cy="270" r="23"/>
    <path d="M54 270 H206 M130 194 V346"/>
  </g>
  <g fill="#aab6c2" transform="translate(130 270) scale(.83)">
    <path d="M0 -8 C30 -60 70 -40 62 -14 C40 -20 18 -14 0 -8Z"/>
    <path d="M0 -8 C30 -60 70 -40 62 -14 C40 -20 18 -14 0 -8Z" transform="rotate(120)"/>
    <path d="M0 -8 C30 -60 70 -40 62 -14 C40 -20 18 -14 0 -8Z" transform="rotate(240)"/>
    <circle r="12" fill="#c9d2da"/>
  </g>
  <g stroke="#9aa6b2" stroke-width="4" stroke-linecap="round">
    <path d="M238 190 H272 M238 208 H272 M238 226 H272 M238 244 H272"/>
  </g>
  <text x="255" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7682" letter-spacing="1">ACOND</text>

  <!-- ===== dům ===== -->
  <path d="M312 150 L450 82 L588 150Z" fill="#c0563d"/>
  <rect x="330" y="145" width="240" height="280" rx="6" fill="#f3ead9" stroke="#c9b99a" stroke-width="3"/>
  <g transform="translate(400 345)">
    <rect width="100" height="62" rx="7" fill="url(#hot)" stroke="#b56b5e" stroke-width="2"/>
    <path d="M18 9 V53 M34 9 V53 M50 9 V53 M66 9 V53 M82 9 V53" stroke="#b56b5e" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ===== zásobník TUV ===== -->
  <rect x="362" y="470" width="200" height="390" rx="40" fill="url(#tank)" stroke="#8d99a5" stroke-width="3"/>
  <path d="M380 520 C402 532 402 552 380 564 C402 576 402 596 380 608 C402 620 402 640 380 652 C402 664 402 684 380 696 C402 708 402 728 380 740 C402 752 402 772 380 784 L380 800"
        fill="none" stroke="#c46a52" stroke-width="6" stroke-linecap="round" opacity=".85"/>
  <path d="M562 500 h22 M562 830 h22" stroke="#8d99a5" stroke-width="9" stroke-linecap="round"/>

  <!-- ===== legenda potrubí ===== -->
  <g font-size="15" font-weight="700" letter-spacing=".5">
    <path d="M30 450 H62" stroke="#e5533d" stroke-width="10" stroke-linecap="round"/>
    <text x="76" y="456" fill="#e5533d">VÝSTUPNÍ VODA</text>
    <path d="M30 545 H62" stroke="#3d8be5" stroke-width="10" stroke-linecap="round"/>
    <text x="76" y="551" fill="#3d8be5">ZPÁTEČKA</text>
  </g>

  <!-- popisky -->
  <g font-size="14" font-weight="600" fill="#8a95a1" text-anchor="middle" letter-spacing=".5">
    <text x="160" y="143">VENKOVNÍ JEDNOTKA</text><text x="462" y="890">ZÁSOBNÍK TUV</text>
    <text x="55" y="710">TČ</text><text x="150" y="710">KOMPRESOR</text><text x="245" y="710">ODTÁVÁNÍ</text>
    <text x="55" y="790">BIVALENCE</text><text x="150" y="790">LÉTO</text><text x="245" y="790">CHLAZENÍ</text>
    <text x="55" y="870">PORUCHA</text><text x="150" y="870">REŽIM</text><text x="245" y="870">REGULACE</text>
  </g>
<g font-size="16" font-weight="600" fill="#8a95a1"><circle cx="478" cy="24" r="7.2" fill="#ff6b5e"/><text x="492" y="30">AKTUÁLNÍ</text><circle cx="478" cy="52" r="7.2" fill="#5fd068"/><text x="492" y="58">ŽÁDANÁ</text></g>
</svg>
