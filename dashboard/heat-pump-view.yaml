        left: 81.25%
        top: 18.75%
        background-color: rgba(15,20,26,0.78)
        color: '#ff6b5e'
        border-radius: 12px
        padding: 2px 10px
        font-size: clamp(12px, 1.7vw, 24px)
        font-weight: '600'
        white-space: nowrap
        min-width: 9vw
