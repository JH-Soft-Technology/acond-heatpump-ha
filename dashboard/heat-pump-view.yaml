# Lovelace view: Acond heat pump
# Paste into: Dashboard → ⋮ → Edit dashboard → ⋮ → Raw configuration editor → under `views:`
# (or add a new view and paste into its YAML editor)
# Images are served by the integration at /acond_heatpump/... (no copying needed)
type: sections
max_columns: 4
title: Tepelné čerpadlo
path: tepelne-cerpadlo
icon: mdi:heat-pump-outline
sections:
- type: grid
  column_span: 4
  cards:
  - type: heading
    heading: ♨️ Tepelné čerpadlo Acond
    heading_style: title
    badges:
    - type: entity
      entity: sensor.acond_heartbeat
      name: Modbus
      show_name: true
      icon: mdi:heart-pulse
  - type: picture-elements
    image: /acond_heatpump/heatpump.svg?v=8
    grid_options:
      columns: full
    elements:
    - type: state-label
      entity: sensor.acond_venkovni_teplota
      style:
        left: 15.8%
        top: 15.6%
        background-color: rgba(15,20,26,0.78)
        color: '#fff'
        border-radius: 12px
        padding: 2px 12px
        font-size: clamp(13px, 2vw, 26px)
        font-weight: '600'
        white-space: nowrap
      prefix: 'Venku '
    - type: state-label
      entity: sensor.acond_vystupni_voda
      style:
        left: 39.2%
        top: 33.6%
        background-color: rgba(15,20,26,0.78)
        color: '#fff'
        border-radius: 12px
