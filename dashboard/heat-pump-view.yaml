- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: 📈 Teploty za 24 hodin
    heading_style: title
  - type: history-graph
    hours_to_show: 24
    grid_options:
      columns: full
      rows: 6
    entities:
    - entity: sensor.acond_venkovni_teplota
      name: Venku
    - entity: sensor.acond_okruh_1_aktualni
      name: Okruh 1
    - entity: sensor.acond_tuv_aktualni
      name: TUV
    - entity: sensor.acond_zpatecka_aktualni
      name: Zpátečka
    - entity: sensor.acond_vystupni_voda
      name: Výstupní voda
