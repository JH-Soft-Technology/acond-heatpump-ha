name: Feature request
description: Suggest a new entity, register or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to have?
    validations:
      required: true
  - type: textarea
    id: registers
    attributes:
      label: Related Modbus registers
      description: If the feature needs registers not supported yet, list them (address, meaning, scale).
