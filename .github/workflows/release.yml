name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  check-version:
    name: Check manifest version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(jq -r .version custom_components/acond_heatpump/manifest.json)
          echo "tag=$TAG manifest=$VER"
          test "$TAG" = "$VER"
